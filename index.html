<!DOCTYPE html>
<html lang="ms-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GrowFarm Log - Sistem pencatatan pertanian sayur">
    <title>GrowFarm Log</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#15803d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrowFarm Log">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2315803d' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='white' text-anchor='middle' dy='.3em'>🌱</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React + ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- ====================================================== -->
    <!-- GANTI 2 BARIS DI BAWAH DENGAN KUNCI SUPABASE KAU       -->
    <!-- ====================================================== -->
    <script>
        const SUPABASE_URL = "https://nswfjzysqlxdtsxkhtdr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zd2ZqenlzcWx4ZHRzeGtodGRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDI0MjcsImV4cCI6MjA5NjcxODQyN30.J_ji_4Vp6n_8g-6z9jn0ShliZ5sj9gj70JtotVjt1lg";
    </script>
    <!-- ====================================================== -->

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===== Supabase client =====
        let supa = null;
        try {
            if (SUPABASE_URL && !SUPABASE_URL.includes("MASUKKAN")) {
                supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        const DAYS = ["Isn", "Sel", "Rab", "Kha", "Jum", "Sab", "Ahd"];
        const WEATHER = ["Panas", "Hujan", "Mendung", "Redup", "Gerimis", "Ribut"];
        const STATUS_CYCLE = ["", "done", "skip"];

        const fmtDate = (d) =>
            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
                d.getDate()
            ).padStart(2, "0")}`;

        const getMonday = (d) => {
            const x = new Date(d);
            const day = (x.getDay() + 6) % 7;
            x.setDate(x.getDate() - day);
            x.setHours(0, 0, 0, 0);
            return x;
        };

        const addDays = (d, n) => {
            const x = new Date(d);
            x.setDate(x.getDate() + n);
            return x;
        };

        const shiftDateStr = (s, n) => {
            const [y, m, d] = s.split("-").map(Number);
            return fmtDate(addDays(new Date(y, m - 1, d), n));
        };

        const displayDate = (s) => {
            const [y, m, d] = s.split("-");
            return `${d}/${m}/${y}`;
        };

        const dayName = (s) => {
            const [y, m, d] = s.split("-").map(Number);
            const names = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
            return names[new Date(y, m - 1, d).getDay()];
        };

        // ===== Storage layer: localStorage + Supabase =====
        function lsGet(key, fallback) {
            try {
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : fallback;
            } catch {
                return fallback;
            }
        }

        function lsSet(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.error("Storage error:", e);
            }
        }

        // Simpan ke local + cloud
        async function saveData(key, value) {
            lsSet(key, value); // local dulu (instant)
            if (supa) {
                try {
                    await supa
                        .from("growfarm_data")
                        .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: "key" });
                } catch (e) {
                    console.error("Cloud save error:", e);
                }
            }
        }

        // Load semua data dari cloud, fallback ke local
        async function loadAllCloud() {
            if (!supa) return null;
            try {
                const { data, error } = await supa.from("growfarm_data").select("key, value");
                if (error) throw error;
                const map = {};
                (data || []).forEach((row) => {
                    map[row.key] = row.value;
                    lsSet(row.key, row.value); // cache local sekali
                });
                return map;
            } catch (e) {
                console.error("Cloud load error:", e);
                return null;
            }
        }

        const DEFAULT_TASKS = [
            { id: "t1", name: "Semburan racun" },
            { id: "t2", name: "Baja" },
            { id: "t3", name: "Siram / cek pam" },
            { id: "t4", name: "Tuai" },
        ];

        const DEFAULT_CATS = [
            "Kangkung", "Bayam Hijau", "Bayam Merah", "Remayong", "Sawi",
            "Bendi", "Labu Air", "Kacang Panjang", "Limau Kasturi", "Petola",
            "Terung", "Peria Katak", "Lobak Putih", "Timun", "Cucumber",
        ];

        const DEFAULT_CUSTOMERS = ["Pasar Borong Alor Setar"];

        function GrowFarmApp() {
            const [tab, setTab] = useState("tugasan");
            const [loaded, setLoaded] = useState(false);
            const [syncStatus, setSyncStatus] = useState(supa ? "Menyegerak..." : "Mod luar talian");
            const cloudData = useRef({});

            const [tasks, setTasks] = useState(DEFAULT_TASKS);
            const [newTask, setNewTask] = useState("");
            const [monday, setMonday] = useState(getMonday(new Date()));
            const [matrix, setMatrix] = useState({});
            const weekKey = fmtDate(monday);

            const [logDate, setLogDate] = useState(fmtDate(new Date()));
            const [log, setLog] = useState({ am: "", pm: "", masalah: "", nota: "" });
            const [logStatus, setLogStatus] = useState("");
            const logTimer = useRef(null);
            const logLoaded = useRef(false);

            const [cats, setCats] = useState(DEFAULT_CATS);
            const [customers, setCustomers] = useState(DEFAULT_CUSTOMERS);
            const [prod, setProd] = useState([]);
            const [pDate, setPDate] = useState(fmtDate(new Date()));
            const [pCat, setPCat] = useState(DEFAULT_CATS[0]);
            const [pCust, setPCust] = useState(DEFAULT_CUSTOMERS[0]);
            const [pKg, setPKg] = useState("");
            const [newCat, setNewCat] = useState("");
            const [newCust, setNewCust] = useState("");
            const [hasilView, setHasilView] = useState("rekod");
            const [showManage, setShowManage] = useState(false);
            const [exportMsg, setExportMsg] = useState("");

            // Helper: ambil value (cloud kalau ada, fallback local)
            const getVal = (key, fallback) => {
                if (key in cloudData.current) return cloudData.current[key];
                return lsGet(key, fallback);
            };

            // Initial load — cuba cloud dulu
            useEffect(() => {
                (async () => {
                    const cloud = await loadAllCloud();
                    if (cloud) {
                        cloudData.current = cloud;
                        setSyncStatus("✓ Tersegerak");
                    } else if (supa) {
                        setSyncStatus("⚠ Sync gagal — guna data tempatan");
                    }

                    setTasks(getVal("tasks", DEFAULT_TASKS));
                    const c = getVal("categories", DEFAULT_CATS);
                    setCats(c);
                    if (c.length) setPCat(c[0]);
                    const cu = getVal("customers", DEFAULT_CUSTOMERS);
                    setCustomers(cu);
                    if (cu.length) setPCust(cu[0]);
                    setProd(getVal("production", []));
                    setLoaded(true);

                    if (cloud) setTimeout(() => setSyncStatus(""), 2500);
                })();
            }, []);

            useEffect(() => {
                setMatrix(getVal(`matrix:${weekKey}`, {}));
            }, [weekKey, loaded]);

            useEffect(() => {
                logLoaded.current = false;
                setLog(getVal(`daylog:${logDate}`, { am: "", pm: "", masalah: "", nota: "" }));
                logLoaded.current = true;
                setLogStatus("");
            }, [logDate, loaded]);

            useEffect(() => {
                if (!logLoaded.current) return;
                setLogStatus("Menyimpan...");
                if (logTimer.current) clearTimeout(logTimer.current);
                logTimer.current = setTimeout(async () => {
                    cloudData.current[`daylog:${logDate}`] = log;
                    await saveData(`daylog:${logDate}`, log);
                    setLogStatus("✓ Disimpan");
                }, 700);
                return () => clearTimeout(logTimer.current);
            }, [log]);

            const cycleCell = (taskId, dayIdx) => {
                const cur = matrix[taskId]?.[dayIdx] || "";
                const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
                const m = { ...matrix, [taskId]: { ...(matrix[taskId] || {}), [dayIdx]: next } };
                setMatrix(m);
                cloudData.current[`matrix:${weekKey}`] = m;
                saveData(`matrix:${weekKey}`, m);
            };

            const addTask = () => {
                const name = newTask.trim();
                if (!name) return;
                const t = [...tasks, { id: `t${Date.now()}`, name }];
                setTasks(t);
                cloudData.current["tasks"] = t;
                saveData("tasks", t);
                setNewTask("");
            };

            const removeTask = (id) => {
                const t = tasks.filter((x) => x.id !== id);
                setTasks(t);
                cloudData.current["tasks"] = t;
                saveData("tasks", t);
            };

            const moveTask = (idx, dir) => {
                const j = idx + dir;
                if (j < 0 || j >= tasks.length) return;
                const t = [...tasks];
                [t[idx], t[j]] = [t[j], t[idx]];
                setTasks(t);
                cloudData.current["tasks"] = t;
                saveData("tasks", t);
            };

            const addProd = () => {
                const kg = parseFloat(pKg);
                if (!pCat || isNaN(kg) || kg <= 0) return;
                const p = [...prod, { id: `p${Date.now()}`, date: pDate, category: pCat, customer: pCust || "", kg }];
                setProd(p);
                cloudData.current["production"] = p;
                saveData("production", p);
                setPKg("");
            };

            const removeProd = (id) => {
                const p = prod.filter((x) => x.id !== id);
                setProd(p);
                cloudData.current["production"] = p;
                saveData("production", p);
            };

            const addCat = () => {
                const c = newCat.trim();
                if (!c || cats.includes(c)) return;
                const list = [...cats, c];
                setCats(list);
                cloudData.current["categories"] = list;
                saveData("categories", list);
                setPCat(c);
                setNewCat("");
            };

            const removeCat = (c) => {
                const list = cats.filter((x) => x !== c);
                setCats(list);
                cloudData.current["categories"] = list;
                saveData("categories", list);
                if (pCat === c && list.length) setPCat(list[0]);
            };

            const addCust = () => {
                const c = newCust.trim();
                if (!c || customers.includes(c)) return;
                const list = [...customers, c];
                setCustomers(list);
                cloudData.current["customers"] = list;
                saveData("customers", list);
                setPCust(c);
                setNewCust("");
            };

            const removeCust = (c) => {
                const list = customers.filter((x) => x !== c);
                setCustomers(list);
                cloudData.current["customers"] = list;
                saveData("customers", list);
                if (pCust === c && list.length) setPCust(list[0]);
            };

            const exportExcel = () => {
                try {
                    setExportMsg("Menyediakan fail...");
                    const wb = XLSX.utils.book_new();
                    const sorted = [...prod].sort((a, b) => a.date.localeCompare(b.date));
                    const prodRows = sorted.map((r) => ({
                        Tarikh: r.date, Kategori: r.category, Pelanggan: r.customer || "", KG: r.kg,
                    }));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
                        prodRows.length ? prodRows : [{ Tarikh: "", Kategori: "", Pelanggan: "", KG: "" }]
                    ), "Hasil");

                    const catTotals = {};
                    sorted.forEach((r) => { catTotals[r.category] = (catTotals[r.category] || 0) + r.kg; });
                    const catRows = Object.entries(catTotals).sort((a, b) => b[1] - a[1])
                        .map(([c, kg]) => ({ Kategori: c, "Jumlah KG": kg }));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
                        catRows.length ? catRows : [{ Kategori: "", "Jumlah KG": "" }]
                    ), "Ikut Kategori");

                    const custTotals = {};
                    sorted.forEach((r) => { const k = r.customer || "(tiada)"; custTotals[k] = (custTotals[k] || 0) + r.kg; });
                    const custRows = Object.entries(custTotals).sort((a, b) => b[1] - a[1])
                        .map(([c, kg]) => ({ Pelanggan: c, "Jumlah KG": kg }));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
                        custRows.length ? custRows : [{ Pelanggan: "", "Jumlah KG": "" }]
                    ), "Ikut Pelanggan");

                    const logRows = [];
                    Object.keys(cloudData.current).filter(k => k.startsWith("daylog:")).forEach(k => {
                        const v = cloudData.current[k];
                        logRows.push({
                            Tarikh: k.replace("daylog:", ""), "Cuaca AM": v.am || "", "Cuaca PM": v.pm || "",
                            Masalah: v.masalah || "", Nota: v.nota || "",
                        });
                    });
                    // tambah dari local yang mungkin tak dalam cloud cache
                    Object.keys(localStorage).filter(k => k.startsWith("daylog:")).forEach(k => {
                        if (!logRows.find(r => "daylog:" + r.Tarikh === k)) {
                            try {
                                const v = JSON.parse(localStorage.getItem(k));
                                logRows.push({
                                    Tarikh: k.replace("daylog:", ""), "Cuaca AM": v.am || "", "Cuaca PM": v.pm || "",
                                    Masalah: v.masalah || "", Nota: v.nota || "",
                                });
                            } catch {}
                        }
                    });
                    logRows.sort((a, b) => a.Tarikh.localeCompare(b.Tarikh));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
                        logRows.length ? logRows : [{ Tarikh: "", "Cuaca AM": "", "Cuaca PM": "", Masalah: "", Nota: "" }]
                    ), "Log Harian");

                    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
                    const blob = new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `GrowFarm_Data_${fmtDate(new Date())}.xlsx`;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 30000);
                    setExportMsg("✓ Fail dihantar ke download");
                    setTimeout(() => setExportMsg(""), 4000);
                } catch (e) {
                    console.error(e);
                    setExportMsg("✗ Download gagal");
                }
            };

            const copyCSV = () => {
                try {
                    const sorted = [...prod].sort((a, b) => a.date.localeCompare(b.date));
                    let csv = "Tarikh\tKategori\tPelanggan\tKG\n";
                    sorted.forEach((r) => { csv += `${r.date}\t${r.category}\t${r.customer || ""}\t${r.kg}\n`; });
                    navigator.clipboard.writeText(csv);
                    setExportMsg("✓ Data disalin — paste dalam Excel/Sheets");
                    setTimeout(() => setExportMsg(""), 5000);
                } catch (e) {
                    setExportMsg("✗ Gagal salin");
                }
            };

            const wkStart = fmtDate(getMonday(new Date()));
            const wkEnd = fmtDate(addDays(getMonday(new Date()), 6));
            const weekTotal = prod.filter((r) => r.date >= wkStart && r.date <= wkEnd).reduce((s, r) => s + r.kg, 0);
            const allTotal = prod.reduce((s, r) => s + r.kg, 0);

            const byDate = {};
            prod.forEach((r) => { (byDate[r.date] = byDate[r.date] || []).push(r); });
            const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

            const catSummary = {};
            const custSummary = {};
            prod.forEach((r) => {
                catSummary[r.category] = (catSummary[r.category] || 0) + r.kg;
                const ck = r.customer || "(tiada)";
                custSummary[ck] = (custSummary[ck] || 0) + r.kg;
            });
            const catSummaryRows = Object.entries(catSummary).sort((a, b) => b[1] - a[1]);
            const custSummaryRows = Object.entries(custSummary).sort((a, b) => b[1] - a[1]);

            if (!loaded)
                return (
                    <div className="flex items-center justify-center h-screen text-green-700 font-medium">
                        Memuatkan...
                    </div>
                );

            return (
                <div className="min-h-screen bg-green-50 pb-10">
                    <div className="bg-green-700 text-white px-4 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="text-lg font-bold">🌱 GrowFarm Log</h1>
                            <p className="text-green-100 text-xs">Mukim Tobiar, Pendang</p>
                        </div>
                        {syncStatus && (
                            <span className="text-xs text-green-100 bg-green-800 px-2 py-1 rounded">
                                {syncStatus}
                            </span>
                        )}
                    </div>

                    <div className="flex bg-white border-b border-green-200 sticky top-0 z-10">
                        {[["tugasan", "Tugasan"], ["log", "Log Harian"], ["hasil", "Hasil (kg)"]].map(([k, label]) => (
                            <button key={k} onClick={() => setTab(k)}
                                className={`flex-1 py-3 text-sm font-semibold ${tab === k ? "text-green-700 border-b-2 border-green-700 bg-green-50" : "text-gray-500"}`}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {tab === "tugasan" && (
                        <div className="p-3">
                            <div className="flex items-center justify-between mb-3">
                                <button onClick={() => setMonday(addDays(monday, -7))}
                                    className="px-3 py-1 bg-white border border-green-300 rounded text-green-700 text-sm font-medium">← Lepas</button>
                                <div className="text-sm font-semibold text-green-800">
                                    {displayDate(fmtDate(monday))} – {displayDate(fmtDate(addDays(monday, 6)))}
                                </div>
                                <button onClick={() => setMonday(addDays(monday, 7))}
                                    className="px-3 py-1 bg-white border border-green-300 rounded text-green-700 text-sm font-medium">Depan →</button>
                            </div>

                            <div className="overflow-x-auto bg-white rounded-lg shadow-sm border border-green-200">
                                <table className="w-full text-sm">
                                    <thead>
                                        <tr className="bg-green-100 text-green-800">
                                            <th className="w-10"></th>
                                            <th className="text-left px-2 py-2 min-w-32">Tugasan</th>
                                            {DAYS.map((d, i) => {
                                                const isToday = fmtDate(addDays(monday, i)) === fmtDate(new Date());
                                                return (
                                                    <th key={d} className={`px-1 py-2 text-xs ${isToday ? "bg-yellow-200" : ""}`}>
                                                        {d}<div className="text-gray-500 font-normal">{addDays(monday, i).getDate()}</div>
                                                    </th>
                                                );
                                            })}
                                            <th className="w-6"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {tasks.map((t, idx) => (
                                            <tr key={t.id} className="border-t border-green-100">
                                                <td className="pl-1">
                                                    <div className="flex flex-col">
                                                        <button onClick={() => moveTask(idx, -1)} disabled={idx === 0}
                                                            className={`text-xs leading-none py-0.5 px-1 ${idx === 0 ? "text-gray-200" : "text-green-600 hover:bg-green-100 rounded"}`}>▲</button>
                                                        <button onClick={() => moveTask(idx, 1)} disabled={idx === tasks.length - 1}
                                                            className={`text-xs leading-none py-0.5 px-1 ${idx === tasks.length - 1 ? "text-gray-200" : "text-green-600 hover:bg-green-100 rounded"}`}>▼</button>
                                                    </div>
                                                </td>
                                                <td className="px-2 py-2 font-medium text-gray-800">{t.name}</td>
                                                {DAYS.map((_, i) => {
                                                    const st = matrix[t.id]?.[i] || "";
                                                    return (
                                                        <td key={i} className="px-1 py-1 text-center">
                                                            <button onClick={() => cycleCell(t.id, i)}
                                                                className={`w-8 h-8 rounded font-bold text-sm ${st === "done" ? "bg-green-600 text-white" : st === "skip" ? "bg-red-100 text-red-500" : "bg-gray-100 text-gray-300"}`}>
                                                                {st === "done" ? "✓" : st === "skip" ? "✗" : "·"}
                                                            </button>
                                                        </td>
                                                    );
                                                })}
                                                <td className="pr-1">
                                                    <button onClick={() => removeTask(t.id)} className="text-gray-300 hover:text-red-500 text-xs">✕</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="flex gap-2 mt-3">
                                <input value={newTask} onChange={(e) => setNewTask(e.target.value)}
                                    onKeyDown={(e) => e.key === "Enter" && addTask()}
                                    placeholder="Tambah tugasan baru..."
                                    className="flex-1 px-3 py-2 rounded border border-green-300 text-sm" />
                                <button onClick={addTask} className="px-4 py-2 bg-green-700 text-white rounded text-sm font-semibold">Tambah</button>
                            </div>
                            <p className="text-xs text-gray-500 mt-2">Tekan kotak: · → ✓ siap → ✗ skip · Guna ▲▼ untuk susun</p>
                        </div>
                    )}

                    {tab === "log" && (
                        <div className="p-3 space-y-3">
                            <div className="bg-white rounded-lg border border-green-200 p-2 flex items-center justify-between">
                                <button onClick={() => setLogDate(shiftDateStr(logDate, -1))}
                                    className="px-3 py-1.5 bg-green-50 border border-green-300 rounded text-green-700 text-sm font-medium">← Semalam</button>
                                <div className="text-center">
                                    <div className="text-sm font-bold text-green-800">{dayName(logDate)}</div>
                                    <input type="date" value={logDate} onChange={(e) => e.target.value && setLogDate(e.target.value)}
                                        className="text-xs text-gray-600 bg-transparent text-center" />
                                    <div className="text-xs text-green-700 font-medium h-4">{logStatus}</div>
                                </div>
                                <button onClick={() => setLogDate(shiftDateStr(logDate, 1))}
                                    className="px-3 py-1.5 bg-green-50 border border-green-300 rounded text-green-700 text-sm font-medium">Esok →</button>
                            </div>

                            {logDate !== fmtDate(new Date()) && (
                                <button onClick={() => setLogDate(fmtDate(new Date()))}
                                    className="w-full py-1.5 text-xs text-green-700 bg-green-100 rounded font-medium">↩ Kembali ke hari ini</button>
                            )}

                            {["am", "pm"].map((slot) => (
                                <div key={slot} className="bg-white rounded-lg p-3 border border-green-200">
                                    <div className="text-sm font-semibold text-green-800 mb-2">Cuaca {slot.toUpperCase()}</div>
                                    <div className="flex flex-wrap gap-2">
                                        {WEATHER.map((w) => (
                                            <button key={w} onClick={() => setLog({ ...log, [slot]: log[slot] === w ? "" : w })}
                                                className={`px-3 py-1.5 rounded-full text-sm ${log[slot] === w ? "bg-green-700 text-white" : "bg-gray-100 text-gray-600"}`}>{w}</button>
                                        ))}
                                    </div>
                                </div>
                            ))}

                            <div className="bg-white rounded-lg p-3 border border-green-200">
                                <div className="text-sm font-semibold text-green-800 mb-2">Masalah</div>
                                <textarea value={log.masalah} onChange={(e) => setLog({ ...log, masalah: e.target.value })}
                                    placeholder="cth: white rust kat plot bayam, pam borewell tersekat..." rows={3}
                                    className="w-full px-3 py-2 rounded border border-gray-200 text-sm" />
                            </div>

                            <div className="bg-white rounded-lg p-3 border border-green-200">
                                <div className="text-sm font-semibold text-green-800 mb-2">Nota</div>
                                <textarea value={log.nota} onChange={(e) => setLog({ ...log, nota: e.target.value })}
                                    placeholder="Nota tambahan..." rows={3}
                                    className="w-full px-3 py-2 rounded border border-gray-200 text-sm" />
                            </div>
                        </div>
                    )}

                    {tab === "hasil" && (
                        <div className="p-3 space-y-3">
                            <div className="bg-green-700 text-white rounded-lg p-3 flex justify-between items-center">
                                <span className="text-sm">Jumlah minggu ini</span>
                                <span className="text-xl font-bold">{weekTotal.toLocaleString()} kg</span>
                            </div>

                            <div className="flex bg-white rounded-lg border border-green-200 overflow-hidden">
                                {[["rekod", "Rekod"], ["ringkasan", "Ringkasan"]].map(([k, label]) => (
                                    <button key={k} onClick={() => setHasilView(k)}
                                        className={`flex-1 py-2 text-sm font-semibold ${hasilView === k ? "bg-green-700 text-white" : "text-gray-500"}`}>{label}</button>
                                ))}
                            </div>

                            {hasilView === "rekod" && (
                                <>
                                    <div className="bg-white rounded-lg p-3 border border-green-200 space-y-2">
                                        <div className="text-sm font-semibold text-green-800">Rekod hasil</div>
                                        <input type="date" value={pDate} onChange={(e) => setPDate(e.target.value)}
                                            className="w-full px-3 py-2 rounded border border-gray-200 text-sm" />
                                        <div className="flex gap-2">
                                            <select value={pCat} onChange={(e) => setPCat(e.target.value)}
                                                className="flex-1 px-3 py-2 rounded border border-gray-200 text-sm bg-white">
                                                {cats.map((c) => (<option key={c}>{c}</option>))}
                                            </select>
                                            <input type="number" value={pKg} onChange={(e) => setPKg(e.target.value)}
                                                placeholder="kg" inputMode="decimal"
                                                className="w-24 px-3 py-2 rounded border border-gray-200 text-sm" />
                                        </div>
                                        <select value={pCust} onChange={(e) => setPCust(e.target.value)}
                                            className="w-full px-3 py-2 rounded border border-gray-200 text-sm bg-white">
                                            {customers.map((c) => (<option key={c}>{c}</option>))}
                                        </select>
                                        <button onClick={addProd}
                                            className="w-full py-2 bg-green-700 text-white rounded font-semibold text-sm">+ Tambah Rekod</button>

                                        <button onClick={() => setShowManage(!showManage)}
                                            className="w-full py-1.5 text-xs text-gray-500 bg-gray-50 rounded font-medium">
                                            {showManage ? "▲ Tutup urus senarai" : "▼ Urus senarai sayur & pelanggan"}
                                        </button>

                                        {showManage && (
                                            <div className="space-y-3 pt-1">
                                                <div>
                                                    <div className="text-xs font-semibold text-green-800 mb-1.5">Kategori sayur</div>
                                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                                        {cats.map((c) => (
                                                            <span key={c} className="inline-flex items-center gap-1 px-2 py-1 bg-green-50 border border-green-200 rounded-full text-xs text-gray-700">
                                                                {c}<button onClick={() => removeCat(c)} className="text-gray-400 hover:text-red-500 font-bold">✕</button>
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input value={newCat} onChange={(e) => setNewCat(e.target.value)}
                                                            onKeyDown={(e) => e.key === "Enter" && addCat()}
                                                            placeholder="Kategori sayur baru..."
                                                            className="flex-1 px-3 py-1.5 rounded border border-gray-200 text-xs" />
                                                        <button onClick={addCat} className="px-3 py-1.5 bg-gray-200 text-gray-700 rounded text-xs font-medium">Tambah</button>
                                                    </div>
                                                </div>
                                                <div>
                                                    <div className="text-xs font-semibold text-green-800 mb-1.5">Pelanggan</div>
                                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                                        {customers.map((c) => (
                                                            <span key={c} className="inline-flex items-center gap-1 px-2 py-1 bg-amber-50 border border-amber-200 rounded-full text-xs text-gray-700">
                                                                {c}<button onClick={() => removeCust(c)} className="text-gray-400 hover:text-red-500 font-bold">✕</button>
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input value={newCust} onChange={(e) => setNewCust(e.target.value)}
                                                            onKeyDown={(e) => e.key === "Enter" && addCust()}
                                                            placeholder="Pelanggan baru..."
                                                            className="flex-1 px-3 py-1.5 rounded border border-gray-200 text-xs" />
                                                        <button onClick={addCust} className="px-3 py-1.5 bg-gray-200 text-gray-700 rounded text-xs font-medium">Tambah</button>
                                                    </div>
                                                    <p className="text-xs text-gray-400 mt-1">Buang dari senarai tak padam rekod lama.</p>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-white rounded-lg p-3 border border-green-200 space-y-2">
                                        <button onClick={exportExcel} className="w-full py-2.5 bg-amber-600 text-white rounded-lg font-semibold text-sm">📊 Muat Turun Excel (.xlsx)</button>
                                        <button onClick={copyCSV} className="w-full py-2.5 bg-white border-2 border-amber-600 text-amber-700 rounded-lg font-semibold text-sm">📋 Salin Data</button>
                                        {exportMsg && (<p className="text-xs text-center font-medium text-green-700">{exportMsg}</p>)}
                                    </div>

                                    {dates.map((d) => {
                                        const rows = byDate[d];
                                        const total = rows.reduce((s, r) => s + r.kg, 0);
                                        return (
                                            <div key={d} className="bg-white rounded-lg border border-green-200 overflow-hidden">
                                                <div className="flex justify-between px-3 py-2 bg-green-100 text-sm font-semibold text-green-800">
                                                    <span>{displayDate(d)}</span><span>{total.toLocaleString()} kg</span>
                                                </div>
                                                {rows.map((r) => (
                                                    <div key={r.id} className="flex justify-between items-center px-3 py-2 border-t border-green-50 text-sm">
                                                        <div>
                                                            <div className="text-gray-700">{r.category}</div>
                                                            {r.customer && (<div className="text-xs text-gray-400">{r.customer}</div>)}
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="font-medium">{r.kg} kg</span>
                                                            <button onClick={() => removeProd(r.id)} className="text-gray-300 hover:text-red-500 text-xs">✕</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })}
                                    {!prod.length && (<p className="text-center text-sm text-gray-400 py-4">Belum ada rekod hasil.</p>)}
                                </>
                            )}

                            {hasilView === "ringkasan" && (
                                <>
                                    <div className="bg-white rounded-lg p-3 border border-green-200 flex justify-between items-center">
                                        <span className="text-sm text-gray-600">Jumlah keseluruhan</span>
                                        <span className="text-lg font-bold text-green-800">{allTotal.toLocaleString()} kg</span>
                                    </div>
                                    <div className="bg-white rounded-lg border border-green-200 overflow-hidden">
                                        <div className="px-3 py-2 bg-green-100 text-sm font-semibold text-green-800">Jumlah ikut kategori</div>
                                        {catSummaryRows.map(([c, kg]) => (
                                            <div key={c} className="flex justify-between items-center px-3 py-2 border-t border-green-50 text-sm">
                                                <span className="text-gray-700">{c}</span>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-medium">{kg.toLocaleString()} kg</span>
                                                    <span className="text-xs text-gray-400 w-12 text-right">{allTotal ? ((kg / allTotal) * 100).toFixed(1) : 0}%</span>
                                                </div>
                                            </div>
                                        ))}
                                        {!catSummaryRows.length && (<p className="text-center text-xs text-gray-400 py-3">Tiada data.</p>)}
                                    </div>
                                    <div className="bg-white rounded-lg border border-green-200 overflow-hidden">
                                        <div className="px-3 py-2 bg-amber-100 text-sm font-semibold text-amber-800">Jumlah ikut pelanggan</div>
                                        {custSummaryRows.map(([c, kg]) => (
                                            <div key={c} className="flex justify-between items-center px-3 py-2 border-t border-amber-50 text-sm">
                                                <span className="text-gray-700">{c}</span>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-medium">{kg.toLocaleString()} kg</span>
                                                    <span className="text-xs text-gray-400 w-12 text-right">{allTotal ? ((kg / allTotal) * 100).toFixed(1) : 0}%</span>
                                                </div>
                                            </div>
                                        ))}
                                        {!custSummaryRows.length && (<p className="text-center text-xs text-gray-400 py-3">Tiada data.</p>)}
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<GrowFarmApp />);
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(err => console.log("SW register failed:", err));
        }
    </script>
</body>
</html>
